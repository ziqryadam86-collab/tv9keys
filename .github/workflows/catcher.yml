name: Extract Cartoon Network Key to XML

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  extract-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract Key & Save XML
        run: |
          # 1. Ekstrak key dan potong teks '#KODIPROP:inputstream.adaptive.license_key='
          RAW_KEY=$(curl -s "https://ptv2026.com/PerfecttvFree3.m3u" | grep -i -A 6 "Cartoon Network" | grep "license_key=" | sed 's/#KODIPROP:inputstream.adaptive.license_key=//g' | tr -d '\r')

          # 2. Simpan terus dalam tag <key>
          cat <<EOF > key-cn-my.xml
<?xml version="1.0" encoding="UTF-8"?>
<key>$RAW_KEY</key>
EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add key-cn-my.xml
          git commit -m "Update CN Key" || exit 0
          git push

