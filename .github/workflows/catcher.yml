name: Extract Cartoon Network Key to XML

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Beri kebenaran untuk push fail ke repo
permissions:
  contents: write

jobs:
  extract-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Key & Save XML
        run: |
          # 1. Ambil nilai key sahaja daripada M3U
          RAW_KEY=$(curl -s "https://ptv2026.com/PerfecttvFree3.m3u" | grep -i -A 6 "Cartoon Network" | grep "license_key=" | sed 's/#KODIPROP:inputstream.adaptive.license_key=//g' | tr -d '\r')

          # 2. Simpan ke fail key-cn-my.xml
          cat <<EOF > key-cn-my.xml
<?xml version="1.0" encoding="UTF-8"?>
<key>$RAW_KEY</key>
EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add key-cn-my.xml
          git commit -m "Update CN Key" || exit 0
          git push
          
